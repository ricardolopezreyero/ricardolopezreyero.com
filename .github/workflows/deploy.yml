# ricardolopezreyero.com · compilar y publicar en Cloudflare · Ricardo López Reyero (RLR)
# En cada push a main: compila el sitio. Si el repositorio tiene el secreto
# CLOUDFLARE_API_TOKEN, además lo publica en Cloudflare (Worker ricardolopezreyero-com).
# Sin el secreto solo comprueba que compile; publicar a mano es `npm run deploy`.
name: Publicar sitio en Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-rlr
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

    steps:
      - name: Descargar proyecto y archivos LFS
        uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar sitio
        run: npm run build

      - name: Comprobar resultado
        run: |
          test -s build/index.html
          # Cloudflare rechaza archivos de más de 25 MB: esos van en /pesados (R2).
          GRANDES="$(find build -type f -size +25M)"
          if [ -n "$GRANDES" ]; then
            echo "Estos archivos pasan de 25 MB; muévelos a /pesados (ver pesados/LEEME.md):"
            echo "$GRANDES"
            exit 1
          fi

      - name: Publicar en Cloudflare
        if: env.HAY_TOKEN == 'true'
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 93695b987a7460c681c06ca4df901ef4
